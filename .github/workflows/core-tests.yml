name: Core Python smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install core and test extras
        run: python -m pip install -e '.[models,test]'
      - name: Check model and selection contracts
        run: python -m pytest tests/test_scene_contract.py tests/test_global_predictor.py tests/test_pipeline.py tests/test_experiments.py
      - name: Untrained integration smoke
        run: python examples/global_core_smoke.py
